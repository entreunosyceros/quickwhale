# Plantilla: Node + PostgreSQL
services:
  api:
    image: node:20-alpine
    container_name: ${PROJECT_NAME:-mi-api}-node
    working_dir: /app
    ports:
      - "${HOST_PORT:-3000}:3000"
    volumes:
      - ./app:/app
    command: sh -c "npm install && npm run dev"
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    container_name: ${PROJECT_NAME:-mi-api}-db
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

volumes:
  pg_data:

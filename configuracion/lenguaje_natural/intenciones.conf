# =============================================================================
# QuickWhale — Frases de lenguaje natural (intenciones.conf)
# =============================================================================
#
# Edita este archivo para añadir, quitar o cambiar frases SIN modificar código.
#
# Formato de cada bloque:
#   @ID_INTENT          Identificador único (no cambiar si no sabes el código)
#   priority=N          Menor número = se evalúa antes (más específico arriba)
#   label=...           Texto mostrado al reconocer la frase ("He entendido: ...")
#   command=...         Comando equivalente (informativo)
#   pattern=...         Frase que activa este intent (minúsculas, sin acentos ok)
#
# Puedes repetir pattern= varias veces por bloque.
# Las líneas con # son comentarios.
#
# Documentación ampliada: configuracion/lenguaje_natural/ejemplos.md
# =============================================================================

# --- Frustración / ayuda general ---


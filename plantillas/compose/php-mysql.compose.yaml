# Plantilla: PHP + MySQL (desarrollo)
services:
  web:
    image: php:8.2-apache
    container_name: ${PROJECT_NAME:-mi-app}-web
    ports:
      - "${HOST_PORT:-8080}:80"
    volumes:
      - ./html:/var/www/html
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: ${PROJECT_NAME:-mi-app}-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: app
      MYSQL_USER: app
      MYSQL_PASSWORD: app
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:

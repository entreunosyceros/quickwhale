# QuickWhale v1.0 - Proyecto de ejemplo para probar Docker Compose
# Uso: desde el menú QuickWhale (compose up) o manualmente:
#   cd examples && docker compose up -d

services:
  web:
    image: nginx:alpine
    container_name: quickwhale-demo-web
    ports:
      - "8080:80"
    volumes:
      - ./html:/usr/share/nginx/html:ro
    restart: unless-stopped
